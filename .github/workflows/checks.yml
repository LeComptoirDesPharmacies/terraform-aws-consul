name: checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: terraform fmt
        run: docker run --rm -v "$PWD:/w" -w /w hashicorp/terraform:latest fmt -check -recursive -no-color

      # Every directory holding .tf files is validated on its own, with no backend and no AWS credentials.
      - name: terraform validate
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint sh hashicorp/terraform:latest -c '
            set -e
            rc=0
            for dir in $(find . -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u); do
              echo "--- $dir"
              if ! (cd "$dir" && terraform init -backend=false -no-color > /dev/null && terraform validate -no-color); then
                rc=1
              fi
            done
            exit $rc'

  packer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The amazon plugin has to be installed explicitly: Packer only auto-installs plugins for HCL2 templates.
      - name: packer validate
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint sh hashicorp/packer:light -c '
            set -e
            packer plugins install github.com/hashicorp/amazon
            packer validate examples/consul-ami/consul.json
            packer validate examples/example-with-encryption/packer/consul-with-certs.json'

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: test/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # Compiles the terratest suite without running it: no AWS resources, no cost.
      - name: go vet
        run: go vet ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/w" -w /w koalaman/shellcheck:stable --severity=error -f gcc \
            modules/install-consul/install-consul \
            modules/install-dnsmasq/install-dnsmasq \
            modules/run-consul/run-consul
